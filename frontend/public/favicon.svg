<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#E100FF" />
      <stop offset="100%" style="stop-color:#2B6CF6" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#glowGradient)" filter="url(#glow)" />
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
  <circle cx="50" cy="50" r="35" fill="#0C0028" />
  <circle cx="50" cy="50" r="30" fill="url(#glowGradient)" opacity="0.8" />
  <circle cx="60" cy="40" r="5" fill="white" opacity="0.8" />
  <circle cx="30" cy="60" r="3" fill="white" opacity="0.6" />
  <circle cx="40" cy="25" r="2" fill="white" opacity="0.5" />
  <circle cx="70" cy="65" r="1.5" fill="white" opacity="0.4" />
</svg>